; CONFIGURAÇÕES PHP - AMBIENTE DOCKER
; Configurações locais para o sistema ERP

[PHP]
max_execution_time = 300
max_input_time = 300
; Relatorios de vistoria enviam varios campos por item do checklist.
max_input_vars = 10000
memory_limit = 256M

[FILES]
upload_max_filesize = 20M
post_max_size = 22M
file_uploads = On

[SESSION]
session.auto_start = 0
session.gc_maxlifetime = 3600
session.use_cookies = 1
session.use_only_cookies = 1
session.name = ERPSESSID
session.cookie_httponly = 1

[ERROR LOGGING]
display_errors = Off
log_errors = On
error_log = /var/www/html/logs/php_errors.log

[DATE]
date.timezone = America/Sao_Paulo

[OUTPUT]
default_charset = UTF-8
