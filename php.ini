; CONFIGURAÇÕES PHP - HOSTGATOR
; Configurações locais para o sistema ERP

[PHP]
max_execution_time = 300
max_input_time = 300
; Relatorios de vistoria enviam varios campos por item do checklist.
max_input_vars = 10000
memory_limit = 256M

[FILES]
upload_max_filesize = 50M
post_max_size = 256M
file_uploads = On

[SESSION]
session.auto_start = 0
; Manter a sessao por ate um ano; nao ha logout automatico por inatividade.
session.gc_maxlifetime = 31536000
session.cookie_lifetime = 31536000
session.save_path = "/var/www/html/storage/sessions"
session.use_cookies = 1
session.use_only_cookies = 1
session.name = ERPSESSID
session.cookie_httponly = 1

[ERROR LOGGING]
display_errors = Off
log_errors = On
error_log = ../logs/php_errors.log

[DATE]
date.timezone = America/Sao_Paulo

[OUTPUT]
default_charset = UTF-8
